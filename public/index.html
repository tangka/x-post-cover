<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Post Cover Template</title>
  <style>
    @font-face {
      font-family: "TwitterChirp";
      src: url("https://abs.twimg.com/responsive-web/client-web/Chirp-Regular.80fda27a.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "TwitterChirp";
      src: url("https://abs.twimg.com/responsive-web/client-web/Chirp-Bold.ebb56aba.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --w: 360px;
      --text: #0f1419;
      --muted: #536471;
      --line: #e6e8ea;
      --blue: #1d9bf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      font-family: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      min-height: 480px;
    }

    .cover {
      min-height: 480px;
      position: relative;
      width: var(--w);
      margin: 0 auto;
      background: #fff;
      color: var(--text);
    }

    .top {
      height: 237px;
    }

    .qrcode {
      position: absolute;
      left: 8px;
      top: 8px;
      display: block;
      width: 48px;
      height: 48px;
      object-fit: cover;
      image-rendering: pixelated;
    }

    .post-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post {
      position: relative;
      padding: 0 10px 24px;
    }

    .post-head {
      display: flex;
      align-items: start;
      padding-right: 31px;
    }

    .avatar {
      flex: 0 0 auto;
      width: 27px;
      height: 27px;
      border-radius: 999px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .identity {
      flex: 1 1 auto;
      min-width: 0;
      margin-left: 6px;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 15px;
      font-size: 13px;
      font-weight: 700;
      line-height: 15px;
    }

    .verified {
      display: inline-grid;
      place-items: center;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
    }

    .verified svg {
      width: 7px;
      height: 7px;
      stroke-width: 1.2;
    }

    .handle {
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
    }

    .head-icons {
      position: absolute;
      right: 10px;
      top: 9px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #0f1419;
    }

    .head-icons svg {
      display: block;
    }

    .head-icons .grok-icon {
      width: 13px;
      height: 13px;
      fill: currentColor;
      stroke: none;
    }

    .head-icons .more-icon {
      width: 13px;
      height: 13px;
      fill: var(--muted);
      stroke: none;
    }

    .text {
      margin-top: 14px;
    }

    .paragraph {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      line-height: 14px;
      white-space: normal;
    }

    .paragraph + .paragraph {
      margin-top: 9px;
    }

    .translation {
      margin-top: 13px;
    }

    .time {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      white-space: nowrap;
    }

    .time .views-count {
      color: var(--text);
      font-weight: 700;
    }

    .divider {
      height: 1px;
      margin-top: 5px;
      background: var(--line);
    }

    .metrics {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 16px;
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .metric svg {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .metric-value:empty {
      display: none;
    }

  </style>
</head>
<body>
  <main class="cover">
    <section class="top">
      <img class="qrcode" data-src="qrcode" alt="">
    </section>
    <div class="post-container">
      <article class="post">
        <header class="post-head">
          <div class="avatar">
            <img data-src="avatar" alt="">
          </div>
          <div class="identity">
            <div class="author-row">
              <span data-text="authorName"></span>
              <span class="verified" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12.5 9.3 17 19 7"></path>
                </svg>
              </span>
            </div>
            <div class="handle" data-text="handle"></div>
          </div>
          <div class="head-icons" aria-hidden="true">
            <svg class="grok-icon" viewBox="0.36 0.5 33.33 32">
              <path d="M13.2371 21.0407L24.3186 12.8506C24.8619 12.4491 25.6384 12.6057 25.8973 13.2294C27.2597 16.5185 26.651 20.4712 23.9403 23.1851C21.2297 25.8989 17.4581 26.4941 14.0108 25.1386L10.2449 26.8843C15.6463 30.5806 22.2053 29.6665 26.304 25.5601C29.5551 22.3051 30.562 17.8683 29.6205 13.8673L29.629 13.8758C28.2637 7.99809 29.9647 5.64871 33.449 0.844576C33.5314 0.730667 33.6139 0.616757 33.6964 0.5L29.1113 5.09055V5.07631L13.2343 21.0436"></path>
              <path d="M10.9503 23.0313C7.07343 19.3235 7.74185 13.5853 11.0498 10.2763C13.4959 7.82722 17.5036 6.82767 21.0021 8.2971L24.7595 6.55998C24.0826 6.07017 23.215 5.54334 22.2195 5.17313C17.7198 3.31926 12.3326 4.24192 8.67479 7.90126C5.15635 11.4239 4.0499 16.8403 5.94992 21.4622C7.36924 24.9165 5.04257 27.3598 2.69884 29.826C1.86829 30.7002 1.0349 31.5745 0.36364 32.5L10.9474 23.0341"></path>
            </svg>
            <svg class="more-icon" viewBox="0 0 24 24">
              <circle cx="5" cy="12" r="1.8"></circle>
              <circle cx="12" cy="12" r="1.8"></circle>
              <circle cx="19" cy="12" r="1.8"></circle>
            </svg>
          </div>
        </header>

        <section class="text">
          <div data-paragraphs="englishText"></div>
          <div class="translation" data-paragraphs="translatedText"></div>
        </section>

        <div class="time" data-time-line></div>
        <div class="divider"></div>

        <footer class="metrics">
          <div class="metric">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067C5.444 18.11 1.751 14.5 1.751 10Zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756Z"></path></svg>
            <span class="metric-value" data-fmt-count="metrics.reply_count"></span>
          </div>
          <div class="metric">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 3.88 8.932 8.02 7.568 9.48 5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88ZM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2Z"></path></svg>
            <span class="metric-value" data-fmt-count="metrics.retweet_count"></span>
          </div>
          <div class="metric">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16L12.002 8.75l-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91Zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67Z"></path></svg>
            <span class="metric-value" data-fmt-count="metrics.like_count"></span>
          </div>
        </footer>
      </article>
    </div>
  </main>

  <script src="./post-data.js"></script>
  <script>
    const data = window.X_POST_COVER_DATA;
    const get = (path) => path.split(".").reduce((v, k) => v?.[k], data);

    function fmtCount(n) {
      n = parseInt(n, 10);
      if (isNaN(n)) return "";
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
      return String(n);
    }

    document.querySelectorAll("[data-text]").forEach((node) => {
      node.textContent = get(node.dataset.text) ?? "";
    });

    document.querySelectorAll("[data-src]").forEach((node) => {
      node.src = get(node.dataset.src) ?? "";
    });

    if (!data.showQrcode) {
      document.querySelector(".qrcode")?.remove();
    }

    document.querySelectorAll("[data-paragraphs]").forEach((node) => {
      node.replaceChildren(...(get(node.dataset.paragraphs) ?? []).map((text) => {
        const p = document.createElement("p");
        p.className = "paragraph";
        p.textContent = text;
        return p;
      }));
    });

    document.querySelectorAll("[data-time-line]").forEach((node) => {
      const dt = new Date(data.created_at);
      const time = dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
      const date = dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      const views = fmtCount(data.views);

      node.append(document.createTextNode(`${time} · ${date} · `));
      const span = document.createElement("span");
      span.className = "views-count";
      span.textContent = views;
      node.append(span);
      node.append(document.createTextNode(" Views"));
    });

    document.querySelectorAll("[data-fmt-count]").forEach((node) => {
      node.textContent = fmtCount(get(node.dataset.fmtCount));
    });
  </script>
</body>
</html>
